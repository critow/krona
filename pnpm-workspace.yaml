packages:
  - packages/*
  - playground

# A version published less than a day ago is not installed. The npm worms of
# the last year were pulled within hours of publishing, and a pin bumped inside
# that window would have carried one in. Installs from the lockfile — which is
# every install in CI — are unaffected.
minimumReleaseAge: 1440

catalog:
  # runtime deps (core) — exactly three, see docs/SECURITY notes in README
  jsonc-parser: 3.3.1
  yaml: 2.9.0
  diff: 9.0.0

  # peer / react
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@tanstack/react-virtual': 3.14.10
  '@tanstack/virtual-core': 3.17.8

  # tooling
  typescript: 5.9.3
  tsdown: 0.22.14
  vitest: 4.1.11
  '@vitest/browser': 4.1.11
  '@vitest/coverage-v8': 4.1.11
  '@biomejs/biome': 2.5.10
  vite: 8.2.2
  '@vitejs/plugin-react': 6.1.0
  playwright: 1.62.1
  '@playwright/test': 1.62.1
  publint: 0.3.24
  '@arethetypeswrong/cli': 0.18.5
  '@types/node': 26.2.0
  '@vitest/browser-playwright': 4.1.11
  vitest-browser-react: 2.2.0
