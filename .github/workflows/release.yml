name: Release

on:
  push:
    tags: ['v*']

permissions:
  # The GitHub Release, and the OIDC token npm needs to attest provenance.
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  # A publish is not something to cancel halfway: npm would keep whatever
  # already landed, and the version could never be reused.
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          # Trusted publishing requires npm >= 11.5.1 and Node >= 22.14.
          # The current npm reference workflow uses Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      - name: Check the tag against the repository
        run: node scripts/release-check.mjs "${GITHUB_REF_NAME#v}" --notes-out release-notes.md

      # The tag names a commit that already passed CI, but this is the last
      # gate before a version becomes permanent, so everything that guards the
      # published artifact runs again. The screenshot suite does not: it judges
      # pixels in the demo, which is deployed separately.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm check-deps
      - run: pnpm --filter @kronajs/core exec publint
      - run: pnpm --filter kronajs exec publint
      - run: pnpm --filter @kronajs/core exec attw --pack . --profile node16
      - run: pnpm --filter kronajs exec attw --pack . --profile node16 --exclude-entrypoints styles.css

      # Packed by pnpm and published by npm. pnpm resolves `workspace:*` and
      # `catalog:` into real versions while packing, which npm alone cannot do;
      # npm attaches the provenance attestation, which pnpm has no flag for.
      - name: Pack
        run: |
          pnpm --filter @kronajs/core pack --pack-destination packs
          pnpm --filter kronajs pack --pack-destination packs

      - name: Publish to npm
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          publish_or_fetch() {
            package="$1"
            tarball="$2"

            # A retry must not overwrite an immutable version. Download the
            # exact npm artifact so the eventual GitHub Release carries the
            # same bytes even when the first run stopped after publishing.
            if npm view "${package}@${version}" version >/dev/null 2>&1; then
              echo "${package}@${version} is already published, skipping"
              rm "$tarball"
              npm pack "${package}@${version}" --pack-destination packs
            else
              # npm exchanges GitHub's OIDC token for a short-lived publish
              # credential. Trusted publishing adds provenance automatically.
              npm publish "$tarball" --access public
            fi
          }

          # Core first: the React package's dependency on it is now a real
          # version range, and a dependency that does not exist yet fails install.
          publish_or_fetch @kronajs/core "./packs/kronajs-core-${version}.tgz"
          publish_or_fetch kronajs "./packs/kronajs-${version}.tgz"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            packs/*.tgz
