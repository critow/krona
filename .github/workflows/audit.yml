name: Audit

# Advisories arrive on their own schedule, and every version here is pinned, so
# nothing else in this repository would ever notice one. Weekly, and by hand
# when needed — not on pull requests, where an advisory in the toolchain would
# block work that has nothing to do with it.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # What ships: any known problem in the five runtime packages fails this.
      - run: pnpm audit --prod --audit-level=high
      # What builds it: only the worst, since a toolchain advisory reaches
      # nobody who installs Krona.
      - run: pnpm audit --audit-level=critical
