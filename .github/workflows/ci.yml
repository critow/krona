name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # This runner's filesystem is the only one that tolerates two names
      # differing by case, so it is the one that has to refuse them.
      - run: pnpm check-names
      - run: pnpm check-css
      # The README reference tables are checked against the actual public
      # surface, so a new prop cannot land undocumented.
      - run: pnpm check-docs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The published dependency graph is part of the contract: a new transitive
      # package should be a decision, not a surprise in someone's lockfile.
      - run: pnpm check-deps
      - run: pnpm --filter @kronajs/core exec publint
      - run: pnpm --filter kronajs exec publint
      - run: pnpm --filter @kronajs/element exec publint
      - run: pnpm --filter @kronajs/core exec attw --pack . --profile node16
      # styles.css is excluded because attw judges every entrypoint by whether it
      # resolves to JS or type declarations, which a stylesheet never can.
      - run: pnpm --filter kronajs exec attw --pack . --profile node16 --exclude-entrypoints styles.css
      - run: pnpm --filter @kronajs/element exec attw --pack . --profile node16 --exclude-entrypoints styles.css

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The whole suite, not just the browser half: coverage is one number for
      # one library, and half of Krona is exercised from node while the other
      # half needs a real browser. Splitting the report would call the core's
      # React callers uncovered and the React package's core imports uncovered,
      # when between them they are not. This is the job that has a browser, so
      # this is the job that can report it.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7
