name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-css
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The published dependency graph is part of the contract: a new transitive
      # package should be a decision, not a surprise in someone's lockfile.
      - run: pnpm check-deps
      - run: pnpm --filter @krona/core exec publint
      - run: pnpm --filter krona exec publint
      - run: pnpm --filter @krona/core exec attw --pack . --profile node16
      # styles.css is excluded because attw judges every entrypoint by whether it
      # resolves to JS or type declarations, which a stylesheet never can.
      - run: pnpm --filter krona exec attw --pack . --profile node16 --exclude-entrypoints styles.css

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7
