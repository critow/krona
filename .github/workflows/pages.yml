name: Deploy playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit each floating tag pointed at when this file was
      # written; the version in the comment is what that commit is.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium renders the page once so the deployed HTML carries its own
      # markup: a crawler that does not run scripts would otherwise be handed
      # an empty div, and several of the ones that matter do not run scripts.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:demo
        env:
          KRONA_BASE: /krona/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The only job that can write to the site, and it runs none of the
    # repository's own code: the install, the build and the browser all happen
    # in the job above, which holds nothing but a read-only token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must already be enabled for the repository, with the source set to
      # GitHub Actions (Settings -> Pages -> Build and deployment -> Source).
      # This job cannot do it: creating a Pages site needs repository admin
      # rights, which GITHUB_TOKEN never has, whatever `permissions:` says.
      # Until that one-time switch is flipped, this step fails with
      # "Resource not accessible by integration".
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
