name: Deploy playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium renders the page once so the deployed HTML carries its own
      # markup: a crawler that does not run scripts would otherwise be handed
      # an empty div, and several of the ones that matter do not run scripts.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:demo
        env:
          KRONA_BASE: /krona/
      # Pages must already be enabled for the repository, with the source set to
      # GitHub Actions (Settings -> Pages -> Build and deployment -> Source).
      # This job cannot do it: creating a Pages site needs repository admin
      # rights, which GITHUB_TOKEN never has, whatever `permissions:` says.
      # Until that one-time switch is flipped, this step fails with
      # "Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist
      - id: deployment
        uses: actions/deploy-pages@v4
