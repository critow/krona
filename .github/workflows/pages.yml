name: Deploy playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter krona-playground build
        env:
          KRONA_BASE: /krona/
      - uses: actions/configure-pages@v5
        with:
          # Without this the first run fails on a repository where Pages has
          # never been turned on: the action reads the site config and 404s.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist
      - id: deployment
        uses: actions/deploy-pages@v4
