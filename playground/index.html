<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Collapsible tree view, side-by-side diff and in-place editing for JSON, YAML, TOML and INI/.env config files — a React component you can try in the browser."
    />
    <meta name="color-scheme" content="dark light" />

    <link rel="canonical" href="https://critow.github.io/krona/" />

    <!-- Absolute, because a chat client resolves these on its own server, where
         a relative path means nothing. The card is generated by
         `pnpm build:social` from a screenshot of this very page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Krona" />
    <meta property="og:title" content="Krona — fold, diff and edit config files" />
    <meta
      property="og:description"
      content="Fold, compare and edit JSON, YAML, TOML and INI/.env as text — a React component that never turns your file into an object."
    />
    <meta property="og:url" content="https://critow.github.io/krona/" />
    <meta property="og:image" content="https://critow.github.io/krona/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Two versions of a JSON config side by side, with the changed lines highlighted."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Versioned because the name never changes: browsers hold a favicon far
         longer than the page, and the previous mark outlived two redraws. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg?v=3" />
    <title>Krona — JSON, YAML, TOML and INI viewer and diff for React</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
