# Krona sample — TOML with nested tables and arrays of tables
[package]
name = "krona-demo"
version = "1.4.2"
edition = "2021"
authors = ["Acme <dev@acme.test>"]
description = """
Multi-line basic strings are one folding range,
just like YAML block scalars.
"""

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[workspace]
members = ["crates/*"]
