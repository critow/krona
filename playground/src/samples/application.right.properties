# The edge service, as a Java properties file.
! An exclamation mark starts a comment too, which is why this format is not INI.
server.port = 8443
server.host 0.0.0.0
server.tls.enabled = true

# A value continued over several lines is one entry, and folds as one.
server.tls.ciphers = TLS_AES_128_GCM_SHA256, \
                     TLS_AES_256_GCM_SHA384, \
                     TLS_CHACHA20_POLY1305_SHA256

# An escaped separator keeps the key it belongs to whole.
log\:level = debug
log.file = /var/log/edge.log
