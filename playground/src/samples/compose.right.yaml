# Krona sample — docker-compose style YAML
version: "3.9"

x-common: &common
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  api:
    <<: *common
    image: ghcr.io/acme/api:1.5.0
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://api@db:5432/api
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4317
    depends_on:
      - db
      - cache
      - otel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      retries: 5
    command: |
      sh -c '
        migrate up &&
        exec ./api serve --otel
      '
  db:
    <<: *common
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: hunter2
  cache:
    image: redis:7-alpine
  otel:
    image: otel/opentelemetry-collector:0.104.0

volumes:
  pgdata: {}

notes: >
  Folded scalars collapse newlines into spaces,
  which makes them a single folding range in Krona.
